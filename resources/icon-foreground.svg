<svg width="1024" height="1024" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">
<!--
  @capacitor/assetsはAndroidのアダプティブアイコン生成時、前景レイヤーに
  一律16.7%のinset(スケール換算で約0.667倍)を自動で適用する。それだけでは
  端(特に左下のチップ)が安全ゾーン(66/108 ≈ 61%)からわずかにはみ出すため、
  ここでは軽めに0.9倍だけ追加で縮小しておく(0.667×0.9 ≈ 0.6倍が実際の見た目)。
  (resources/icon.svgの平坦版はこの縮小をせず、原寸のまま使用する)
-->
<g transform="translate(190,190) scale(0.9) translate(-190,-190)">
<path d="M190 70
  C 130 130, 70 170, 70 225
  C 70 265, 100 290, 135 290
  C 155 290, 172 280, 182 265
  C 178 300, 160 320, 135 335
  L 245 335
  C 220 320, 202 300, 198 265
  C 208 280, 225 290, 245 290
  C 280 290, 310 265, 310 225
  C 310 170, 250 130, 190 70 Z"
  fill="#f4f4f0"/>
<g>
  <path d="M255 250
    C 255 232, 270 218, 288 218
    L 345 218
    C 363 218, 378 232, 378 250
    L 378 285
    C 378 303, 363 317, 345 317
    L 300 317
    L 278 340
    L 282 317
    L 288 317
    C 270 317, 255 303, 255 285
    Z"
    fill="#e2b13c" transform="translate(0,0) scale(0.78) translate(72,60)"/>
  <text x="312" y="278" text-anchor="middle" font-size="34" font-weight="700" fill="#153d24" style="font-family: Arial, sans-serif;">EN</text>
</g>
<circle cx="76" cy="300" r="30" fill="#c0392b"/>
<circle cx="76" cy="300" r="30" fill="none" stroke="#f4f4f0" stroke-width="6" stroke-dasharray="8 8"/>
</g>
</svg>
